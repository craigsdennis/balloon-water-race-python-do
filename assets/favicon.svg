<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Orange balloon body -->
  <ellipse cx="50" cy="45" rx="38" ry="42" fill="#ff7b00"/>
  <ellipse cx="35" cy="30" rx="12" ry="8" fill="#ff9e4a" opacity="0.6"/>
  
  <!-- Balloon knot -->
  <polygon points="45,85 50,95 55,85" fill="#ff7b00"/>
  
  <!-- Clown face (🤡) -->
  <!-- White face paint base -->
  <circle cx="50" cy="45" r="25" fill="#ffffff" opacity="0.95"/>
  
  <!-- Red clown nose -->
  <circle cx="50" cy="48" r="6" fill="#ff1744"/>
  <circle cx="48" cy="46" r="2" fill="#ff6b8a"/>
  
  <!-- Eyes -->
  <ellipse cx="40" cy="38" rx="4" ry="5" fill="#1a1a2e"/>
  <ellipse cx="60" cy="38" rx="4" ry="5" fill="#1a1a2e"/>
  <circle cx="41" cy="37" r="1.5" fill="#ffffff"/>
  <circle cx="61" cy="37" r="1.5" fill="#ffffff"/>
  
  <!-- Blue eye makeup -->
  <path d="M 33 35 Q 40 30 47 35" stroke="#00b4d8" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M 53 35 Q 60 30 67 35" stroke="#00b4d8" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  
  <!-- Red mouth -->
  <path d="M 38 55 Q 50 68 62 55" stroke="#ff1744" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- Red hair tufts -->
  <circle cx="28" cy="28" r="7" fill="#ff1744"/>
  <circle cx="72" cy="28" r="7" fill="#ff1744"/>
  <circle cx="25" cy="38" r="5" fill="#ff1744"/>
  <circle cx="75" cy="38" r="5" fill="#ff1744"/>
</svg>
